<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E7D32;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Фон -->
  <rect width="32" height="32" rx="6" fill="url(#grad1)"/>
  
  <!-- Основание подъемника -->
  <rect x="6" y="26" width="20" height="4" rx="1" fill="#1B5E20"/>
  
  <!-- Мачта подъемника -->
  <rect x="15" y="8" width="2" height="18" fill="#1B5E20"/>
  
  <!-- Стрела подъемника -->
  <rect x="8" y="11" width="12" height="1.5" fill="#1B5E20"/>
  
  <!-- Кабина -->
  <rect x="18" y="9" width="4" height="3" rx="0.5" fill="#FFFFFF" stroke="#1B5E20" stroke-width="0.5"/>
  
  <!-- Противовес -->
  <rect x="6" y="12" width="2" height="2" rx="0.3" fill="#1B5E20"/>
  
  <!-- Трос -->
  <line x1="20" y1="12.5" x2="20" y2="9" stroke="#1B5E20" stroke-width="0.5"/>
  <line x1="7" y1="12.5" x2="7" y2="14" stroke="#1B5E20" stroke-width="0.5"/>
  
  <!-- Буква M -->
  <text x="16" y="6" font-family="Arial, sans-serif" font-size="4" font-weight="bold" text-anchor="middle" fill="#FFFFFF">M</text>
</svg> 